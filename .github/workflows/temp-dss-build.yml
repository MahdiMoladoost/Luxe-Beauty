name: Temporary DSS6 Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'temporary-dss-build/**'

permissions:
  contents: read

jobs:
  build-dss:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip pydsstools==3.1.0 numpy pandas
      - name: Generate and validate DSS6 files
        shell: pwsh
        run: |
          (Get-Content temporary-dss-build/generate_dss.py) | Where-Object { $_ -notmatch 'pdc\.y_labels' } | Set-Content temporary-dss-build/generate_dss_fixed.py
          python temporary-dss-build/generate_dss_fixed.py
      - uses: actions/upload-artifact@v4
        with:
          name: Golestan-820504014-DSS6
          path: out/*
          if-no-files-found: error
          retention-days: 1
